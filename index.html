<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner 0.98MB</title>
    <script src="https://unpkg.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #f0f2f5; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #progress-bar { width: 0%; height: 10px; background: #28a745; border-radius: 5px; transition: 0.3s; margin: 10px 0; }
        #reader { width: 100%; margin-top: 15px; border-radius: 10px; overflow: hidden; display: none; }
        .btn { padding: 15px; width: 100%; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; color: white; }
        .btn-start { background: #28a745; display: none; }
        .btn-stop { background: #dc3545; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">📂 กำลังโหลดข้อมูล...</h2>
    <div id="progress-bar"></div>

    <button id="start-btn" class="btn btn-start">📸 เริ่มสแกน</button>
    <button id="stop-btn" class="btn btn-stop">🛑 เสร็จสิ้น</button>

    <div id="reader"></div>

    <div id="summary" style="display:none;">
        <h3>📊 สรุปรายการ (เรียงเลข)</h3>
        <table id="result-table">
            <thead><tr><th>เลขบาร์โค้ด</th><th>จำนวน</th><th>PDF</th></tr></thead>
            <tbody id="result-body"></tbody>
        </table>
        <button class="btn" style="background:#6c757d;" onclick="location.reload()">🔄 สแกนใหม่</button>
    </div>
</div>

<script>
    // *** เปลี่ยนชื่อไฟล์ใน GitHub เป็น data.pdf จะชัวร์ที่สุดครับ ***
    const PDF_NAME = 'data.pdf'; 

    let pdfTextContent = "";
    let scannedData = [];
    let html5QrCode;

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';

    async function init() {
        const bar = document.getElementById('progress-bar');
        const title = document.getElementById('title');

        try {
            const loadingTask = pdfjsLib.getDocument(PDF_NAME);
            loadingTask.onProgress = (p) => {
                if (p.total > 0) bar.style.width = (p.loaded / p.total * 100) + '%';
            };

            const pdf = await loadingTask.promise;
            let fullText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                fullText += content.items.map(item => item.str).join(" ") + " ";
                bar.style.width = (i / pdf.numPages * 100) + '%';
            }

            pdfTextContent = fullText;
            title.innerText = "✅ พร้อมสแกนแล้ว";
            document.getElementById('start-btn').style.display = 'block';
        } catch (err) {
            title.innerText = "❌ ไม่พบไฟล์ " + PDF_NAME;
            bar.style.background = "red";
        }
    }

    window.onload = init;

    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('reader').style.display = 'block';
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('stop-btn').style.display = 'block';
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
            html5QrCode.pause();
            let qty = prompt(`เจอ: ${text}\nระบุจำนวน:`, "1");
            if (qty) scannedData.push({ barcode: text, qty: parseInt(qty) || 0 });
            setTimeout(() => html5QrCode.resume(), 500);
        });
    });

    document.getElementById('stop-btn').addEventListener('click', async () => {
        if (html5QrCode) await html5QrCode.stop();
        document.getElementById('reader').style.display = 'none';
        document.getElementById('stop-btn').style.display = 'none';
        
        const tbody = document.getElementById('result-body');
        scannedData.sort((a, b) => a.barcode.localeCompare(b.barcode));
        scannedData.forEach(item => {
            const found = pdfTextContent.includes(item.barcode.trim());
            tbody.innerHTML += `<tr><td>${item.barcode}</td><td>${item.qty}</td><td style="color:${found?'green':'red'}">${found?'✅':'❌'}</td></tr>`;
        });
        document.getElementById('summary').style.display = 'block';
    });
</script>
</body>
</html>
