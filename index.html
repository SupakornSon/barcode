<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Auto PDF</title>
    <script src="https://unpkg.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #status { padding: 10px; margin: 10px 0; border-radius: 8px; font-weight: bold; background: #eee; }
        .ready { background: #d4edda !important; color: #155724; }
        #reader { width: 100%; margin-top: 15px; border-radius: 10px; overflow: hidden; display: none; }
        .btn { padding: 15px; width: 100%; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-start { background: #28a745; color: white; display: none; } /* ซ่อนไว้ก่อนจนกว่า PDF จะพร้อม */
        .btn-stop { background: #dc3545; color: white; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 ระบบสแกนเทียบ PDF (Auto)</h2>
    
    <div id="status">⏳ กำลังโหลดไฟล์ข้อมูล PDF...</div>

    <button id="start-btn" class="btn btn-start">เริ่มสแกน</button>
    <button id="stop-btn" class="btn btn-stop">เสร็จสิ้น</button>

    <div id="reader"></div>

    <div id="summary" style="display:none; text-align:left;">
        <h3>📊 สรุปผลการเช็ค</h3>
        <table id="result-table">
            <thead>
                <tr><th>บาร์โค้ด</th><th>จำนวน</th><th>สถานะ</th></tr>
            </thead>
            <tbody id="result-body"></tbody>
        </table>
        <button class="btn" style="background:#6c757d; color:white;" onclick="location.reload()">สแกนใหม่</button>
    </div>
</div>

<script>
    // *** เปลี่ยนชื่อไฟล์ตรงนี้ให้ตรงกับชื่อไฟล์ใน GitHub ของคุณ ***
    const PDF_URL = 'รายการสินค้านอกเหนือกลุ่ม 58 ที่สามารถเบิก.pdf'; 

    let pdfTextContent = "";
    let scannedData = [];
    let html5QrCode;

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';

    // ฟังก์ชันโหลดและอ่าน PDF อัตโนมัติ
    async function loadPDF() {
        const statusDiv = document.getElementById('status');
        try {
            const loadingTask = pdfjsLib.getDocument(PDF_URL);
            const pdf = await loadingTask.promise;
            let fullText = "";

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                fullText += content.items.map(item => item.str).join(" ") + " ";
            }

            pdfTextContent = fullText;
            statusDiv.innerText = "✅ ข้อมูล PDF พร้อมแล้ว!";
            statusDiv.className = "ready";
            document.getElementById('start-btn').style.display = 'block';
        } catch (err) {
            statusDiv.innerText = "❌ ไม่พบไฟล์ " + PDF_URL;
            console.error(err);
        }
    }

    // เริ่มโหลด PDF ทันทีที่เปิดหน้าเว็บ
    window.onload = loadPDF;

    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('reader').style.display = 'block';
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('stop-btn').style.display = 'block';
        
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, onScanSuccess);
    });

    function onScanSuccess(decodedText) {
        html5QrCode.pause();
        let qty = prompt(`สแกนเจอ: ${decodedText}\nใส่จำนวน:`, "1");
        if (qty) scannedData.push({ barcode: decodedText, qty: parseInt(qty) });
        setTimeout(() => html5QrCode.resume(), 500);
    }

    document.getElementById('stop-btn').addEventListener('click', async () => {
        if (html5QrCode) await html5QrCode.stop();
        document.getElementById('reader').style.display = 'none';
        document.getElementById('stop-btn').style.display = 'none';
        showSummary();
    });

    function showSummary() {
        const tbody = document.getElementById('result-body');
        scannedData.sort((a, b) => a.barcode.localeCompare(b.barcode));
        scannedData.forEach(item => {
            const isFound = pdfTextContent.includes(item.barcode);
            tbody.innerHTML += `<tr>
                <td>${item.barcode}</td>
                <td>${item.qty}</td>
                <td style="color:${isFound?'green':'red'}">${isFound?'✅ เจอ':'❌ ไม่เจอ'}</td>
            </tr>`;
        });
        document.getElementById('summary').style.display = 'block';
    }
</script>
</body>
</html>
