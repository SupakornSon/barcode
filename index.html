<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Barcode Scanner</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; text-align: center; background: #f4f7f9; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        h2 { color: #333; font-size: 1.2rem; margin-bottom: 15px; }
        
        #progress-container { width: 100%; background: #eee; border-radius: 10px; margin: 15px 0; display: block; overflow: hidden; }
        #progress-bar { width: 0%; height: 12px; background: linear-gradient(90deg, #28a745, #5ddc7b); transition: 0.3s; }
        
        #reader { width: 100%; border-radius: 15px; overflow: hidden; display: none; background: #000; margin-top: 15px; }
        
        .btn { 
            padding: 16px; width: 100%; font-size: 18px; border: none; border-radius: 12px; 
            cursor: pointer; font-weight: bold; margin-top: 10px; color: white; transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-start { background: #28a745; display: none; }
        .btn-stop { background: #dc3545; display: none; }
        
        #summary { margin-top: 20px; display: none; text-align: left; }
        table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
        th, td { border: 1px solid #eee; padding: 12px 8px; text-align: center; }
        th { background: #f8f9fa; color: #555; }
        
        .status-found { color: #28a745; font-weight: bold; }
        .status-notfound { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">📂 กำลังอ่านไฟล์ PDF...</h2>
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <button id="start-btn" class="btn btn-start">📸 เริ่มสแกนบาร์โค้ด</button>
    <button id="stop-btn" class="btn btn-stop">🛑 หยุดสแกนและสรุปผล</button>

    <div id="reader"></div>

    <div id="summary">
        <h3 style="text-align:center;">📊 ผลการตรวจสอบ</h3>
        <table>
            <thead>
                <tr>
                    <th>เลขบาร์โค้ด</th>
                    <th>จำนวน</th>
                    <th>ใน PDF</th>
                </tr>
            </thead>
            <tbody id="result-body"></tbody>
        </table>
        <button class="btn" style="background:#6c757d;" onclick="location.reload()">🔄 เริ่มใหม่</button>
    </div>
</div>

<script>
    // --- ตั้งค่าเริ่มต้น ---
    const PDF_NAME = 'data.pdf'; // ** ต้องชื่อนี้และเป็นตัวเล็กทั้งหมด **
    let pdfTextContent = "";
    let scannedData = [];
    let html5QrCode;

    // ตั้งค่า Worker สำหรับ PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // 1. ฟังก์ชันโหลดและอ่านข้อความจาก PDF
    async function loadPDF() {
        const bar = document.getElementById('progress-bar');
        const title = document.getElementById('title');

        try {
            const loadingTask = pdfjsLib.getDocument(PDF_NAME);
            
            loadingTask.onProgress = (p) => {
                if (p.total > 0) {
                    let percent = (p.loaded / p.total * 100);
                    bar.style.width = percent + '%';
                }
            };

            const pdf = await loadingTask.promise;
            let fullText = "";
            
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const strings = content.items.map(item => item.str);
                fullText += strings.join(" ") + " ";
                
                // อัปเดตความคืบหน้าตามจำนวนหน้า
                bar.style.width = (i / pdf.numPages * 100) + '%';
            }

            pdfTextContent = fullText;
            title.innerText = "✅ โหลดข้อมูลสำเร็จ";
            document.getElementById('progress-container').style.display = 'none';
            document.getElementById('start-btn').style.display = 'block';

        } catch (err) {
            console.error(err);
            title.innerText = "❌ โหลดไฟล์ PDF ไม่สำเร็จ";
            alert("ไม่พบไฟล์ชื่อ " + PDF_NAME + "\nกรุณาตรวจสอบว่าอัปโหลดไฟล์ชื่อนี้ขึ้น GitHub หรือยัง");
            bar.style.background = "#dc3545";
        }
    }

    // เริ่มทำงานเมื่อเปิดหน้าเว็บ
    window.onload = loadPDF;

    // 2. ฟังก์ชันเริ่มสแกน (เปิดกล้อง)
    document.getElementById('start-btn').addEventListener('click', async () => {
        document.getElementById('reader').style.display = 'block';
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('stop-btn').style.display = 'block';
        document.getElementById('summary').style.display = 'none';

        html5QrCode = new Html5Qrcode("reader");
        
        const config = { 
            fps: 15, 
            qrbox: { width: 250, height: 150 }, // ปรับขนาดช่องสแกนให้เหมาะกับบาร์โค้ด
            aspectRatio: 1.0 
        };

        try {
            await html5QrCode.start(
                { facingMode: "environment" }, // ใช้กล้องหลัง
                config,
                (decodedText) => {
                    // เมื่อสแกนเจอ
                    html5QrCode.pause(true); // หยุดชั่วคราวเพื่อรับค่า
                    
                    let qty = prompt(`พบรหัส: ${decodedText}\nระบุจำนวนที่ต้องการ:`, "1");
                    
                    if (qty !== null && qty !== "") {
                        scannedData.push({
                            barcode: decodedText.trim(),
                            qty: parseInt(qty) || 0
                        });
                    }
                    
                    // กลับมาสแกนต่อหลังจากกดตกลง 0.5 วินาที
                    setTimeout(() => html5QrCode.resume(), 500);
                }
            );
        } catch (err) {
            alert("ไม่สามารถเข้าถึงกล้องได้: " + err);
            location.reload();
        }
    });

    // 3. ฟังก์ชันหยุดสแกนและสรุปผล
    document.getElementById('stop-btn').addEventListener('click', async () => {
        if (html5QrCode) {
            await html5QrCode.stop();
            await html5QrCode.clear();
        }

        document.getElementById('reader').style.display = 'none';
        document.getElementById('stop-btn').style.display = 'none';
        document.getElementById('summary').style.display = 'block';
        
        const tbody = document.getElementById('result-body');
        tbody.innerHTML = ""; // ล้างตารางเก่า

        // เรียงลำดับข้อมูลตามรหัสบาร์โค้ด
        scannedData.sort((a, b) => a.barcode.localeCompare(b.barcode));

        scannedData.forEach(item => {
            // ตรวจสอบว่ารหัสที่สแกนมา "มีอยู่ในข้อความจาก PDF" หรือไม่
            const isFound = pdfTextContent.includes(item.barcode);
            
            const row = `
                <tr>
                    <td>${item.barcode}</td>
                    <td>${item.qty}</td>
                    <td class="${isFound ? 'status-found' : 'status-notfound'}">
                        ${isFound ? '✅ มี' : '❌ ไม่มี'}
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });

        if (scannedData.length === 0) {
            tbody.innerHTML = "<tr><td colspan='3'>ไม่มีข้อมูลการสแกน</td></tr>";
        }
    });
</script>

</body>
</html>
